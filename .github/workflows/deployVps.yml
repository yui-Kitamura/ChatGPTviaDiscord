name: Build and deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      register_commands_only:
        description: Register global /gvd definitions without restarting the Bot
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Java without application secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the Maven project
        run: |
          test -f pom.xml || {
            echo '::error::Add the Java 21 Maven application at the repository root (pom.xml).'
            exit 1
          }

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Test deployment authentication without secrets
        run: python3 -m unittest discover -s tests -v

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Stage one executable JAR
        run: |
          set -euo pipefail
          mapfile -d '' jars < <(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            ! -name '*-tests.jar' -print0)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one executable JAR in target/.'
            exit 1
          fi
          unzip -p "${jars[0]}" META-INF/MANIFEST.MF | grep -q '^Main-Class:' || {
            echo '::error::The JAR must have Main-Class and run with java -jar.'
            exit 1
          }
          mkdir -p dist
          cp -- "${jars[0]}" dist/chatgptviadiscord.jar
          cp ops/chatgptviadiscord.service dist/chatgptviadiscord.service
          cp ops/register_gvd_commands.py dist/register_gvd_commands.py
          printf '%s\n' "$GITHUB_SHA" > dist/REVISION
          (cd dist && sha256sum chatgptviadiscord.jar chatgptviadiscord.service register_gvd_commands.py REVISION > SHA256SUMS)

      - name: Upload deployment artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chatgptviadiscord-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy the built artifact to VPS
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.register_commands_only))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: chatgptviadiscord-vps
      cancel-in-progress: false
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check required deployment secrets and fingerprint format
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for setting in VPS_HOST VPS_USERNAME VPS_PASSWORD VPS_HOST_FINGERPRINT; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing deployment secret: $setting"
              exit 1
            fi
          done
          if [[ ! "$VPS_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo '::error::VPS_HOST_FINGERPRINT must contain only the SHA256 fingerprint, without quotes or a key description.'
            exit 1
          fi

      - name: Download this run's build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chatgptviadiscord-${{ github.sha }}
          path: dist

      - name: Verify the artifact
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(cat dist/REVISION)" = "$GITHUB_SHA"

      - name: Prepare the VPS release directory
        if: ${{ !inputs.register_commands_only }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD || secrets.VPS_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: VPS_SUDO_PASSWORD
          script: |
            set -eu
            as_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                printf '%s\n' "${VPS_SUDO_PASSWORD-}" | sudo -S -p '' -- "$@"
              fi
            }
            # The existing runtime configuration is never printed or overwritten.
            as_root test -s /etc/chatgptviadiscord.env
            as_root chown root:root /etc/chatgptviadiscord.env
            as_root chmod 600 /etc/chatgptviadiscord.env
            as_root install -d -o "$(id -un)" -g "$(id -gn)" -m 755 \
              /opt/chatgptviadiscord /opt/chatgptviadiscord/releases

      - name: Upload the release to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: dist/chatgptviadiscord.jar,dist/chatgptviadiscord.service,dist/register_gvd_commands.py,dist/REVISION,dist/SHA256SUMS
          target: /opt/chatgptviadiscord/releases/${{ env.RELEASE_ID }}
          strip_components: 1

      - name: Activate the release and restart the service
        if: ${{ !inputs.register_commands_only }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD || secrets.VPS_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: RELEASE_ID,VPS_SUDO_PASSWORD
          command_timeout: 6m
          script: |
            set -eu
            as_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                printf '%s\n' "${VPS_SUDO_PASSWORD-}" | sudo -S -p '' -- "$@"
              fi
            }
            root=/opt/chatgptviadiscord
            release="$root/releases/$RELEASE_ID"
            cd "$release"
            sha256sum --check SHA256SUMS
            test "$(cat REVISION)" = "${RELEASE_ID%%-*}"
            if ! getent passwd chatgptviadiscord >/dev/null; then
              as_root useradd --system --user-group --home-dir /var/lib/chatgptviadiscord \
                --shell /usr/sbin/nologin chatgptviadiscord
            fi
            as_root install -o root -g root -m 644 chatgptviadiscord.service \
              /etc/systemd/system/chatgptviadiscord.service
            as_root systemctl daemon-reload
            as_root systemctl enable chatgptviadiscord.service
            previous=$(readlink -f "$root/current" || true)
            rollback() {
              if [ -n "$previous" ] && [ -d "$previous" ]; then
                ln -sfn "$previous" "$root/current.next"
                mv -Tf "$root/current.next" "$root/current"
                as_root systemctl restart chatgptviadiscord.service || true
              else
                as_root systemctl stop chatgptviadiscord.service || true
                rm -f "$root/current"
              fi
            }
            ln -sfn "$release" "$root/current.next"
            mv -Tf "$root/current.next" "$root/current"
            if ! as_root systemctl restart chatgptviadiscord.service; then
              rollback
              exit 1
            fi
            invocation=$(systemctl show --property=InvocationID --value chatgptviadiscord.service || true)
            if [ -z "$invocation" ]; then
              rollback
              exit 1
            fi
            for attempt in $(seq 1 65); do
              current=$(systemctl show --property=InvocationID --value chatgptviadiscord.service || true)
              if [ "$current" != "$invocation" ] || ! systemctl is-active --quiet chatgptviadiscord.service; then
                break
              fi
              if as_root journalctl --quiet -b "_SYSTEMD_INVOCATION_ID=$invocation" --no-pager -o cat \
                  | grep -q '^BOT_READY '; then
                echo 'Discord READY and configured guild membership confirmed.'
                exit 0
              fi
              sleep 5
            done
            echo 'Discord readiness was not confirmed; reverting the release.' >&2
            rollback
            exit 1

      - name: Register global commands without restarting the Bot
        if: github.event_name == 'workflow_dispatch' && inputs.register_commands_only
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD || secrets.VPS_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: RELEASE_ID,VPS_SUDO_PASSWORD
          command_timeout: 2m
          script: |
            set -eu
            as_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                printf '%s\n' "${VPS_SUDO_PASSWORD-}" | sudo -S -p '' -- "$@"
              fi
            }
            release="/opt/chatgptviadiscord/releases/$RELEASE_ID"
            cd "$release"
            sha256sum --check SHA256SUMS
            test "$(cat REVISION)" = "${RELEASE_ID%%-*}"
            test -x /usr/bin/python3 || {
              echo 'Python 3 is required on the VPS for command registration.' >&2
              exit 1
            }
            as_root systemd-run --quiet --wait --collect --pipe \
              --unit="gvd-register-$RELEASE_ID" \
              --property=User=chatgptviadiscord \
              --property=Group=chatgptviadiscord \
              --property=EnvironmentFile=/etc/chatgptviadiscord.env \
              --property=WorkingDirectory=/var/lib/chatgptviadiscord \
              /usr/bin/python3 "$release/register_gvd_commands.py"
